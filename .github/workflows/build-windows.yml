name: Build Windows Installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aurora-browser/package-lock.json

      - name: Install dependencies
        working-directory: aurora-browser
        # Native modules (node-llama-cpp, sharp) compile for Windows here
        run: npm install

      - name: Build Windows installer
        working-directory: aurora-browser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-OS-Windows
          path: |
            aurora-browser/dist/*.exe
            aurora-browser/dist/*.yml
          retention-days: 30

      - name: Upload to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aurora-browser/dist/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
